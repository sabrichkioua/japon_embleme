const prefectureKey = name => String(name||'').normalize('NFD')

 if(!name)return '';

}
function refreshPrefectureLabels(){
 const select=$('pref');
 for(let i=1;i<select.options.length;i++){
   const option=select.options[i];
   option.textContent=displayPrefecture(option.value);
 }
}

let language='fr';
const t=()=>translations[language];

 if(!translations[lang])return;

 document.title=lang==='ja'?'日本の市町村章アトラス':lang==='en'?'Municipal Emblems of Japan':'Emblèmes municipaux du Japon';

 const colorOptions=$('color-filter').options;colorOptions[0].textContent=colorData?t().colors:t().colorsLoading;
 t().colorsList.forEach((v,i)=>colorOptions[i+1].textContent=v);
 $('color-mode').options[0].textContent=t().modeDominant;$('color-mode').options[1].textContent=t().modePresent;

document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));

const map=L.map('map',{preferCanvas:true,zoomControl:false}).setView([36.5,137.5],5);
L.control.zoom({position:'bottomright'}).addTo(map);
const baseLayers={
 positron:L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'&copy; OpenStreetMap contributors · Tiles: HOT'}),
 osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'})
};
let activeBase=baseLayers.positron.addTo(map);
Object.values(baseLayers).forEach(layer=>layer.on('tileerror',()=>{console.warn(t().tileError,layer._url)}));
$('basemap').addEventListener('change',()=>{map.removeLayer(activeBase);activeBase=baseLayers[$('basemap').value].addTo(map);activeBase.bringToBack()});
// Le masque est placé entre les tuiles et les couches vectorielles.
map.createPane('prefMaskPane');
map.getPane('prefMaskPane').style.zIndex='350';
map.getPane('prefMaskPane').style.pointerEvents='none';
let prefMask=null;
function updatePrefMask(){
  if(prefMask){map.removeLayer(prefMask);prefMask=null;}
  const selected=$('pref').value;
  if(!selected || !$('boundaries').checked)return;
  const feature=prefLayer.getLayers().find(layer=>norm(prefName(layer.feature.properties))===norm(selected))?.feature;
  if(!feature)return;
  const geometry=feature.geometry;
  // Anneau extérieur couvrant la carte ; les contours de la préfecture sont des trous.
  const world=[[85,-180],[85,180],[-85,180],[-85,-180]];
  const polygons=geometry.type==='MultiPolygon'?geometry.coordinates:[geometry.coordinates];
  const holes=polygons.map(poly=>poly[0].map(([lon,lat])=>[lat,lon]));
  prefMask=L.polygon([world,...holes],{
    pane:'prefMaskPane',stroke:false,fill:true,fillColor:'#ffffff',
    fillOpacity:0.50,fillRule:'evenodd',interactive:false
  }).addTo(map);

const prefLayer=L.geoJSON(null,{style:()=>({color:'#697a85',weight:1,opacity:.65,fillColor:'#c34736',fillOpacity:0}),onEachFeature:(feature,layer)=>{layer.on('click',()=>{const name=prefName(feature.properties);if(!name)return;const select=$('pref');const option=[...select.options].find(o=>norm(o.value)===norm(name));if(option){select.value=option.value;select.dispatchEvent(new Event('change'))}})}}).addTo(map);
function prefName(p){return p.prefecture||p.name||p.name_en||p.NAME_1||p.name_1||p.N03_001||p.PREF_NAME||''}

fetch('prefectures.geojson').then(r=>{if(!r.ok)throw Error('pas de fichier');return r.json()}).then(data=>{prefLayer.addData(data);stylePref()}).catch(()=>{const note=document.createElement('div');note.className='hint';note.id='missing-pref-note';note.textContent=t().missingPref;document.querySelector('.panel').appendChild(note)});
const dots=L.layerGroup().addTo(map),emblems=L.layerGroup().addTo(map),labels=L.layerGroup().addTo(map);
let features=[],markerByCode=new Map(),colorData=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLocaleLowerCase('fr').trim();
function popup(p){const link=/^Q\d+$/.test(p.qid)?`<a href="https://www.wikidata.org/wiki/${p.qid}" target="_blank" rel="noopener noreferrer">Wikidata ${esc(p.qid)}</a>`:'';const file=p.file_title&&p.file_title.startsWith('File:')?`<a href="https://commons.wikimedia.org/wiki/${encodeURIComponent(p.file_title).replace(/%3A/i,':')}" target="_blank" rel="noopener noreferrer">${esc(t().popupSource)}</a>`:'';const name=language==='ja'?(p.name_ja||p.name):(p.name||p.name_ja);return `<h3>${esc(name)}</h3><p>${esc(p.name_ja)} · ${esc(p.prefecture)}</p>${p.image?`<img class="popup-img" src="${encodeURI(p.image)}" alt="${esc(t().popupEmblem)}">`:`<p>${esc(t().popupMissing)}</p>`}<p>${esc(t().popupCode)} : ${esc(p.code5)}</p><p>${link}</p><p>${file}</p>`}
function matches(f,q,pref){const p=f.properties;if(pref&&p.prefecture!==pref)return false;if(!q)return true;return norm([p.name,p.name_ja,p.prefecture,p.prefecture_ja,p.name_search,p.code5].join(' ')).includes(q)}
function matchesColor(f){const chosen=$('color-filter').value;if(!chosen||!colorData)return true;const record=colorData[String(f.properties.code5)];if(!record||record.status!=='ok')return false;return $('color-mode').value==='dominant'?record.dominant_family===chosen:(record.families?.[chosen]||0)>=0.10;}
function refreshColors(){render();updateGallery()}
$('color-filter').addEventListener('change',refreshColors);
$('color-mode').addEventListener('change',refreshColors);
fetch('emblem_colors.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{colorData=data;$('color-filter').disabled=false;$('color-mode').disabled=false;$('color-filter').options[0].text=t().colors;refreshColors()}).catch(()=>{console.info('Analyse chromatique absente : exécuter extraction_couleurs_emblemes.py pour créer emblem_colors.json')});
function emblemSize(z){if(z<8)return 30;if(z<10)return 30;if(z<12)return 40;if(z<14)return 52;return 64}
function render(){dots.clearLayers();emblems.clearLayers();labels.clearLayers();markerByCode.clear();const q=norm($('search').value),pref=$('pref').value,showMissing=$('missing').checked,large=$('all').checked||map.getZoom()>=8,showLabels=$('labels').checked;let visible=0,icons=0;

function focusFeature(f){const [lon,lat]=f.geometry.coordinates;const targetZoom=Math.max(map.getZoom(),12);map.once('moveend',()=>{render();const m=markerByCode.get(String(f.properties.code5));if(m)m.openPopup()});map.flyTo([lat,lon],targetZoom,{duration:0.65});}
function zoomToPrefecture(){const pref=$('pref').value;if(!pref)return;const boundary=prefLayer.getLayers().find(l=>norm(prefName(l.feature.properties))===norm(pref));const pts=features.filter(f=>f.properties.prefecture===pref).map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]]);if(!pts.length)return;const bounds=boundary?boundary.getBounds():L.latLngBounds(pts);const wide=window.innerWidth>700;const right=wide?Math.min(380,Math.round(window.innerWidth*.38)):16;map.fitBounds(bounds,{paddingTopLeft:[16,16],paddingBottomRight:[right,window.innerWidth<=700?Math.round(window.innerHeight*.44):16],maxZoom:11,animate:true,duration:0.65});}
function updateGallery(){stylePref();const pref=$('pref').value,g=$('gallery');if(!pref){g.hidden=true;return}g.hidden=false;const list=features.filter(f=>f.properties.prefecture===pref&&matchesColor(f)).sort((a,b)=>String(a.properties.name).localeCompare(String(b.properties.name),'fr'));
$('gallery-title').textContent=t().galleryTitle(displayPrefecture(pref),list.length);$('gallery-note').textContent=t().galleryNote(list.filter(f=>f.properties.image).length);const grid=$('gallery-grid');grid.replaceChildren();const frag=document.createDocumentFragment();
for(const f of list){const p=f.properties,btn=document.createElement('button');btn.type='button';btn.className='tile';btn.title=p.name+' · '+p.name_ja;if(p.image){const img=document.createElement('img');img.src=p.image;img.loading='lazy';img.alt=t().emblemAlt(p.name);btn.appendChild(img)}else{const small=document.createElement('small');small.textContent=t().noEmblem;btn.appendChild(small)}const name=document.createElement('span');name.textContent=language==='ja'?(p.name_ja||p.name):(p.name||p.name_ja);btn.appendChild(name);btn.addEventListener('click',()=>focusFeature(f));frag.appendChild(btn)}grid.appendChild(frag);
}
function onSearch(){render();const q=norm($('search').value);if(q.length<2)return;const pref=$('pref').value;const subset=features.filter(f=>matches(f,q,pref)&&matchesColor(f));if(!subset.length)return;const exact=subset.find(f=>norm(f.properties.name)===q||norm(f.properties.name_ja)===q||String(f.properties.code5)===q);if(exact){focusFeature(exact)}else if(subset.length===1){focusFeature(subset[0])}}
fetch('data.geojson').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{features=data.features.filter(f=>f.geometry?.type==='Point');const prefs=[...new Set(features.map(f=>f.properties.prefecture).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));for(const p of prefs){const o=document.createElement('option');o.value=p;o.textContent=p;$('pref').appendChild(o)}refreshPrefectureLabels();render();map.on('zoomend',render);
$('search').addEventListener('change',onSearch);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();onSearch();$('search').blur()}});$('search').addEventListener('input',render);
$('pref').addEventListener('change',()=>{render();updateGallery();zoomToPrefecture()});for(const id of ['all','missing','labels'])$(id).addEventListener('change',render);$('gallery-close').addEventListener('click',()=>{$('pref').value='';updateGallery();render()});
}).catch(e=>{$('count').textContent=t().loadError+' : '+e.message+' (HTTP server required; not file://)'});
setLanguage('fr');
</script></body></html>
