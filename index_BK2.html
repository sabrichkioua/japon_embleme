<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emblèmes municipaux du Japon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif}#map{z-index:1}
.panel{position:absolute;top:12px;left:12px;z-index:1000;background:#fffef9f5;padding:14px;border-radius:12px;box-shadow:0 2px 18px #0003;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
h1{font-size:18px;margin:0 0 5px}.sub{font-size:12px;color:#555;margin-bottom:10px}.controls{display:grid;gap:7px}
input,select{width:100%;padding:9px;border:1px solid #bbb;border-radius:7px;font:inherit;font-size:14px}.check{font-size:13px;display:flex;align-items:center;gap:7px}.check input{width:auto}.hint{font-size:12px;color:#555;margin-top:8px}
.marker{background:none;border:none}.marker img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px #fff) drop-shadow(0 0 2px #fff)}.popup-img{width:110px;height:110px;object-fit:contain;display:block;margin:6px auto}.leaflet-popup-content{min-width:170px}.leaflet-popup-content h3{margin:0 0 4px;font-size:16px}.leaflet-popup-content p{margin:3px 0;font-size:12px}.leaflet-popup-content a{color:#075b9c}
.labels-layer{pointer-events:none}.place-label{background:transparent;border:0;white-space:nowrap;overflow:visible;font:600 11px/1.2 system-ui,sans-serif;color:#17242c;text-shadow:-2px -2px 2px white,2px 2px 2px white,2px -2px 2px white,-2px 2px 2px white;transform:translate(0,0);pointer-events:none}
.gallery{position:absolute;z-index:999;right:12px;top:12px;bottom:12px;width:min(350px,calc(100vw - 24px));background:#fffef9f5;box-shadow:0 2px 18px #0003;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.gallery[hidden]{display:none}.gallery-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid #ddd}.gallery-head strong{font-size:15px}.close{border:0;background:#eee;border-radius:6px;cursor:pointer;font-size:18px;width:30px;height:30px}.gallery-grid{overflow-y:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;align-content:start}.tile{border:1px solid #ddd;background:white;border-radius:8px;padding:6px;min-height:105px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}.tile:hover,.tile:focus-visible{border-color:#17648b;outline:2px solid #b8e0ef}.tile img{width:62px;height:62px;object-fit:contain}.tile span{font-size:11px;line-height:1.2;overflow-wrap:anywhere}.tile small{font-size:10px;color:#666}.gallery-note{font-size:12px;color:#666;padding:10px 14px 0}
@media(max-width:700px){.panel{padding:10px;width:min(300px,calc(100vw - 18px));top:9px;left:9px;max-height:45vh}h1{font-size:16px}.sub{font-size:11px}.gallery{top:auto;bottom:0;right:0;left:0;width:100%;height:42vh;border-radius:12px 12px 0 0}.gallery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{min-height:90px}.tile img{width:48px;height:48px}}
</style></head><body><div id="map"></div>
<section class="panel"><h1>日本の市町村章 · Emblèmes du Japon</h1><div class="sub">Atlas expérimental · Wikidata et Wikimedia Commons</div><div class="controls">
<input id="search" placeholder="Rechercher une ville (latin / 日本語)" aria-label="Rechercher une ville"><select id="pref" aria-label="Préfecture"><option value="">Toutes les préfectures</option></select>
<label class="check"><input type="checkbox" id="all"> Afficher les emblèmes même au zoom national</label>
<label class="check"><input type="checkbox" id="missing" checked> Afficher les municipalités sans emblème</label>
<label class="check"><input type="checkbox" id="labels"> Afficher les étiquettes en français</label></div><div id="count" class="hint">Chargement…</div><div class="hint">Sélectionner une préfecture ouvre la galerie. Une recherche de ville centre et zoome sur la localité.</div></section>
<aside id="gallery" class="gallery" hidden aria-label="Galerie des emblèmes"><div class="gallery-head"><strong id="gallery-title">Emblèmes</strong><button id="gallery-close" class="close" aria-label="Fermer la galerie">×</button></div><div id="gallery-note" class="gallery-note"></div><div id="gallery-grid" class="gallery-grid"></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const map=L.map('map',{preferCanvas:true,zoomControl:false}).setView([36.5,137.5],5);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const dots=L.layerGroup().addTo(map),emblems=L.layerGroup().addTo(map),labels=L.layerGroup().addTo(map);
let features=[],markerByCode=new Map();const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLocaleLowerCase('fr').trim();
function popup(p){const link=/^Q\d+$/.test(p.qid)?`<a href="https://www.wikidata.org/wiki/${p.qid}" target="_blank" rel="noopener noreferrer">Wikidata ${esc(p.qid)}</a>`:'';const file=p.file_title&&p.file_title.startsWith('File:')?`<a href="https://commons.wikimedia.org/wiki/${encodeURIComponent(p.file_title).replace(/%3A/i,':')}" target="_blank" rel="noopener noreferrer">Source de l’emblème (Commons)</a>`:'';return `<h3>${esc(p.name)}</h3><p>${esc(p.name_ja)} · ${esc(p.prefecture)}</p>${p.image?`<img class="popup-img" src="${encodeURI(p.image)}" alt="Emblème">`:'<p>Emblème non référencé</p>'}<p>Code : ${esc(p.code5)}</p><p>${link}</p><p>${file}</p>`}
function matches(f,q,pref){const p=f.properties;if(pref&&p.prefecture!==pref)return false;if(!q)return true;return norm([p.name,p.name_ja,p.prefecture,p.prefecture_ja,p.name_search,p.code5].join(' ')).includes(q)}
function render(){dots.clearLayers();emblems.clearLayers();labels.clearLayers();markerByCode.clear();const q=norm($('search').value),pref=$('pref').value,showMissing=$('missing').checked,large=$('all').checked||map.getZoom()>=8,showLabels=$('labels').checked;let visible=0,icons=0;
for(const f of features){const p=f.properties;if(!matches(f,q,pref)||(!p.image&&!showMissing))continue;const [lon,lat]=f.geometry.coordinates;let marker;
if(p.image&&large){marker=L.marker([lat,lon],{icon:L.divIcon({className:'marker',html:`<img src="${encodeURI(p.image)}" loading="lazy" alt="">`,iconSize:[30,30],iconAnchor:[15,15]})});emblems.addLayer(marker);icons++}
else{marker=L.circleMarker([lat,lon],{radius:p.image?3:2,color:p.image?'#2c6685':'#888',weight:1,fillOpacity:.75});dots.addLayer(marker)}
marker.bindPopup(()=>popup(p),{maxWidth:260});markerByCode.set(String(p.code5),marker);visible++;
if(showLabels&&map.getZoom()>=8){const text=p.name||p.name_ja;if(text){const label=L.marker([lat,lon],{interactive:false,keyboard:false,icon:L.divIcon({className:'place-label',html:esc(text),iconSize:[0,0],iconAnchor:[-19,-12]})});labels.addLayer(label)}}
}
$('count').textContent=`${visible.toLocaleString('fr-FR')} municipalités affichées · ${icons.toLocaleString('fr-FR')} emblèmes visibles`;
}
function focusFeature(f){const [lon,lat]=f.geometry.coordinates;const targetZoom=Math.max(map.getZoom(),11);map.flyTo([lat,lon],targetZoom,{duration:0.65});map.once('moveend',()=>{render();const m=markerByCode.get(String(f.properties.code5));if(m)m.openPopup()});}
function updateGallery(){const pref=$('pref').value,g=$('gallery');if(!pref){g.hidden=true;return}g.hidden=false;const list=features.filter(f=>f.properties.prefecture===pref).sort((a,b)=>String(a.properties.name).localeCompare(String(b.properties.name),'fr'));
$('gallery-title').textContent=pref+' · '+list.length+' municipalités';$('gallery-note').textContent=list.filter(f=>f.properties.image).length+' emblèmes disponibles · cliquer pour zoomer';const grid=$('gallery-grid');grid.replaceChildren();const frag=document.createDocumentFragment();
for(const f of list){const p=f.properties,btn=document.createElement('button');btn.type='button';btn.className='tile';btn.title=p.name+' · '+p.name_ja;if(p.image){const img=document.createElement('img');img.src=p.image;img.loading='lazy';img.alt='Emblème de '+p.name;btn.appendChild(img)}else{const small=document.createElement('small');small.textContent='Sans emblème';btn.appendChild(small)}const name=document.createElement('span');name.textContent=p.name||p.name_ja;btn.appendChild(name);btn.addEventListener('click',()=>focusFeature(f));frag.appendChild(btn)}grid.appendChild(frag);
}
function onSearch(){render();const q=norm($('search').value);if(q.length<2)return;const pref=$('pref').value;const subset=features.filter(f=>matches(f,q,pref));if(!subset.length)return;const exact=subset.find(f=>norm(f.properties.name)===q||norm(f.properties.name_ja)===q||String(f.properties.code5)===q);if(exact){focusFeature(exact)}else if(subset.length===1){focusFeature(subset[0])}}
fetch('data.geojson').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{features=data.features.filter(f=>f.geometry?.type==='Point');const prefs=[...new Set(features.map(f=>f.properties.prefecture).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));for(const p of prefs){const o=document.createElement('option');o.value=p;o.textContent=p;$('pref').appendChild(o)}render();map.on('zoomend',render);
$('search').addEventListener('change',onSearch);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();onSearch();$('search').blur()}});$('search').addEventListener('input',render);
$('pref').addEventListener('change',()=>{render();updateGallery()});for(const id of ['all','missing','labels'])$(id).addEventListener('change',render);$('gallery-close').addEventListener('click',()=>{$('pref').value='';updateGallery();render()});
}).catch(e=>{$('count').textContent='Erreur de chargement : '+e.message+' (utiliser un serveur HTTP local, pas file://)'});
</script></body></html>
