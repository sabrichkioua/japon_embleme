<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emblèmes municipaux du Japon</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#map{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif}#map{z-index:1}.panel{position:absolute;top:12px;left:12px;z-index:1000;background:#fffef9f5;padding:14px;border-radius:12px;box-shadow:0 2px 18px #0003;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}h1{font-size:18px;margin:0 0 5px}.sub{font-size:12px;color:#555;margin-bottom:10px}.controls{display:grid;gap:7px}input,select{width:100%;padding:9px;border:1px solid #bbb;border-radius:7px;font:inherit;font-size:14px}.check{font-size:13px;display:flex;align-items:center;gap:7px}.check input{width:auto}.hint{font-size:12px;color:#555;margin-top:8px}.marker{background:none;border:none}.marker img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px #fff) drop-shadow(0 0 2px #fff)}.dot{border:1px solid white;border-radius:50%;background:#2c6685;box-shadow:0 0 0 1px #2c6685}.popup-img{width:110px;height:110px;object-fit:contain;display:block;margin:6px auto}.leaflet-popup-content{min-width:170px}.leaflet-popup-content h3{margin:0 0 4px;font-size:16px}.leaflet-popup-content p{margin:3px 0;font-size:12px}.leaflet-popup-content a{color:#075b9c}@media(max-width:600px){.panel{padding:10px;width:min(290px,calc(100vw - 18px));top:9px;left:9px}h1{font-size:16px}.sub{font-size:11px}}
</style></head><body><div id="map"></div><section class="panel"><h1>日本の市町村章 · Emblèmes du Japon</h1><div class="sub">Atlas expérimental · sources Wikidata et Wikimedia Commons</div><div class="controls"><input id="search" placeholder="Rechercher une ville (latin / 日本語)" aria-label="Rechercher"><select id="pref" aria-label="Préfecture"><option value="">Toutes les préfectures</option></select><label class="check"><input type="checkbox" id="all"> Afficher les emblèmes même au zoom national</label><label class="check"><input type="checkbox" id="missing"> Afficher les municipalités sans emblème</label></div><div id="count" class="hint">Chargement…</div><div class="hint">Cliquez sur un symbole pour voir la fiche. À faible zoom, des points remplacent les emblèmes pour limiter les chevauchements.</div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';const map=L.map('map',{preferCanvas:true,zoomControl:false}).setView([36.5,137.5],5);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const dots=L.layerGroup().addTo(map),emblems=L.layerGroup().addTo(map);let features=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function popup(p){const link=/^Q\d+$/.test(p.qid)?`<a href="https://www.wikidata.org/wiki/${p.qid}" target="_blank" rel="noopener noreferrer">Wikidata ${esc(p.qid)}</a>`:'';const file=p.file_title&&p.file_title.startsWith('File:')?`<a href="https://commons.wikimedia.org/wiki/${encodeURIComponent(p.file_title).replace(/%3A/i,':')}" target="_blank" rel="noopener noreferrer">Source de l’emblème (Commons)</a>`:'';return `<h3>${esc(p.name)}</h3><p>${esc(p.name_ja)} · ${esc(p.prefecture)}</p>${p.image?`<img class="popup-img" src="${encodeURI(p.image)}" alt="Emblème">`:'<p>Emblème non référencé</p>'}<p>Code : ${esc(p.code5)}</p><p>${link}</p><p>${file}</p>`}function render(){dots.clearLayers();emblems.clearLayers();const q=$('search').value.trim().toLocaleLowerCase(),pref=$('pref').value,showMissing=$('missing').checked,showAll=$('all').checked,large=showAll||map.getZoom()>=8;let visible=0,icons=0;for(const f of features){const p=f.properties;if(pref&&p.prefecture!==pref)continue;const hay=[p.name,p.name_ja,p.prefecture,p.prefecture_ja,p.name_search,p.code5].join(' ').toLocaleLowerCase();if(q&&!hay.includes(q))continue;if(!p.image&&!showMissing)continue;const [lon,lat]=f.geometry.coordinates;let marker;if(p.image&&large){marker=L.marker([lat,lon],{icon:L.divIcon({className:'marker',html:`<img src="${encodeURI(p.image)}" loading="lazy" alt="">`,iconSize:[30,30],iconAnchor:[15,15]})});emblems.addLayer(marker);icons++}else{marker=L.circleMarker([lat,lon],{radius:p.image?3:2,color:p.image?'#2c6685':'#888',weight:1,fillOpacity:.75});dots.addLayer(marker)}marker.bindPopup(()=>popup(p),{maxWidth:260});visible++} $('count').textContent=`${visible.toLocaleString('fr-FR')} municipalités affichées · ${icons.toLocaleString('fr-FR')} emblèmes visibles`;}fetch('data.geojson').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{features=data.features.filter(f=>f.geometry?.type==='Point');const prefs=[...new Set(features.map(f=>f.properties.prefecture).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));for(const p of prefs){const o=document.createElement('option');o.value=p;o.textContent=p;$('pref').appendChild(o)}render();map.on('zoomend',render);for(const id of ['search','pref','all','missing'])$(id).addEventListener(id==='search'?'input':'change',render)}).catch(e=>{$('count').textContent='Erreur de chargement : '+e.message+' (utiliser un serveur HTTP local, pas file://)'});
</script></body></html>
